version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: messenger-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API порт
      - "9001:9001"   # Web Console порт
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: messenger  # автоматическое создание бакета
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data: