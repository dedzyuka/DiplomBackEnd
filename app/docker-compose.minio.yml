version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: messenger-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "api-key: mysecretkey123456789012345678901234"
      LIVEKIT_RTC_PORT: 7880
      LIVEKIT_RTC_UDP_PORT: 7881-7889
      LIVEKIT_RTC_TCP_PORT: 7881
    ports:
      - "7880:7880"
      - "7881-7889:7881-7889/udp"
      - "7881:7881/tcp"
    volumes:
      - livekit_data:/tmp/livekit

  coturn:
    image: instrumentisto/coturn
    container_name: coturn
    network_mode: host
    restart: unless-stopped
    environment:
      - TURN_PORT=3478
      - TURN_EXTRA_CONFIG=lt-cred-mech
      - TURN_USER=user:pass

volumes:
  livekit_data:
  minio_data: