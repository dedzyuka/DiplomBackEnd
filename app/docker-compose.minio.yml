version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: messenger-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881-7889:7881-7889/udp"
      - "7882:7882/tcp"
    environment:
      LIVEKIT_KEYS: "api-key: mysecretkey123456789012345678901234"
      LIVEKIT_RTC_PORT: 7880
      LIVEKIT_RTC_UDP_PORT: 7881-7889
      LIVEKIT_RTC_TCP_PORT: 7882
      LIVEKIT_RTC_USE_EXTERNAL_IP: "true"
      LIVEKIT_RTC_ICE_SERVERS: "stun:stun.l.google.com:19302"
      # TURN убраны

volumes:
  minio_data: